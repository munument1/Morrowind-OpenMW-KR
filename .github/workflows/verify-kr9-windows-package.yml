name: Verify Windows KR9 archive replacement safety
on:
  push:
    branches: [master]
    paths:
      - 'packaging/korean/tooling/package_kr9_windows.py'
      - '.github/workflows/verify-kr9-windows-package.yml'
  pull_request:
    paths:
      - 'packaging/korean/tooling/package_kr9_windows.py'
      - '.github/workflows/verify-kr9-windows-package.yml'
      - '.github/workflows/release-kr9-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_TAG: openmw-0.51.0-kr8
      SOURCE_ASSET: Morrowind-Korean-OpenMW-0.51.0-KR8-Full.zip
    steps:
      - uses: actions/checkout@v4
      - name: Download and hash-verify the actual Windows KR8 release
        run: |
          set -euo pipefail
          mkdir -p input staged
          gh release download "$SOURCE_TAG" --pattern "$SOURCE_ASSET" --pattern "$SOURCE_ASSET.sha256" --dir input
          (cd input && sha256sum --check "$SOURCE_ASSET.sha256")
      - name: Verify unchanged executables are rejected and all KR8 data are retained
        run: |
          set -euo pipefail
          python3 -m py_compile packaging/korean/tooling/package_kr9_windows.py
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          from importlib.util import spec_from_file_location, module_from_spec
          spec=spec_from_file_location('kr9_windows_package', 'packaging/korean/tooling/package_kr9_windows.py')
          module=module_from_spec(spec)
          spec.loader.exec_module(module)
          build=module.build
          source=Path('input/Morrowind-Korean-OpenMW-0.51.0-KR8-Full.zip')
          sha=hashlib.sha256(source.read_bytes()).hexdigest()
          with ZipFile(source) as z:
              binaries=[n for n in z.namelist() if n.replace('\\','/').lower()=='payload/openmw.exe']
              assert len(binaries)==1,binaries
              old=z.read(binaries[0])
          exe=Path('staged/openmw-test-only.exe')
          exe.write_bytes(old)
          try:
              build(source,exe,Path('staged/should-not-exist.zip'),sha)
          except ValueError as ex:
              assert 'No executable changes' in str(ex),str(ex)
          else:
              raise AssertionError('KR8 executable relabel accepted without modifications')
          modified=bytearray(old)
          modified[-1]^=1
          exe.write_bytes(modified)
          report=build(source,exe,Path('staged/TEST-ONLY-corrupted-runtime.zip'),sha)
          assert len(report['changed_entries'])==1
          assert report['new_runtime_sha256']!=report['old_runtime_sha256']
          with ZipFile(source) as original, ZipFile('staged/TEST-ONLY-corrupted-runtime.zip') as updated:
              assert all(original.read(n)==updated.read(n) for n in original.namelist()
                         if n not in report['changed_entries'])
          print('KR9_WINDOWS_PACKAGE_GUARD=PASS')
          print('WARNING: synthetic test executable deliberately corrupted. Never publish.')
          PY
      - name: Test next-release document cleanup on the genuine KR9.1 ZIP
        shell: bash
        run: |
          set -euo pipefail
          gh release download openmw-0.51.0-kr9.1 \
            --pattern 'Morrowind-Korean-OpenMW-0.51.0-KR9.1-Full.zip' \
            --pattern 'Morrowind-Korean-OpenMW-0.51.0-KR9.1-Full.zip.sha256' --dir input
          (cd input && sha256sum -c Morrowind-Korean-OpenMW-0.51.0-KR9.1-Full.zip.sha256)
          python3 - <<'PY'
          from importlib.util import spec_from_file_location, module_from_spec
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          spec=spec_from_file_location('pkg', 'packaging/korean/tooling/package_kr9_windows.py')
          mod=module_from_spec(spec)
          spec.loader.exec_module(mod)
          source=Path('input/Morrowind-Korean-OpenMW-0.51.0-KR9.1-Full.zip')
          with ZipFile(source) as original:
              names=original.namelist()
              old=original.read('payload/openmw.exe')
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          candidate=bytearray(old)
          candidate[-1]^=1  # Synthetic test data only; DO NOT publish.
          exe=Path('staged/TEST-ONLY-corrupted.exe')
          exe.write_bytes(candidate)
          out=Path('staged/TEST-ONLY-cleaned.zip')
          result=mod.build(source, exe, out, digest,
                           release_tag='openmw-0.51.0-kr9.2', prune_legacy_docs=True)
          assert set(result['removed_legacy_docs']) == mod.LEGACY_ROOT_DOCS
          assert set(result['changed_entries']) == {'payload/openmw.exe', 'README-KOREAN.txt'}
          assert result['archive_members'] == len(names) - len(mod.LEGACY_ROOT_DOCS)
          with ZipFile(source) as original, ZipFile(out) as cleaned:
              assert cleaned.testzip() is None
              assert set(cleaned.namelist()) == set(names) - mod.LEGACY_ROOT_DOCS
              assert all(original.read(n) == cleaned.read(n)
                         for n in cleaned.namelist() if n not in result['changed_entries'])
              assert 'openmw-0.51.0-kr9.2' in cleaned.read('README-KOREAN.txt').decode('utf-8')
              assert mod.ESSENTIAL_MEMBERS.issubset(set(cleaned.namelist()))
              assert 'payload/resources/vfs/fonts/Galmuri11-OFL-1.1.md' in cleaned.namelist()
          legacy=Path('staged/TEST-ONLY-legacy.zip')
          prior=mod.build(source, exe, legacy, digest, release_tag='openmw-0.51.0-kr9.1')
          assert prior['removed_legacy_docs'] == []
          assert prior['changed_entries'] == ['payload/openmw.exe']
          print('NEXT_RELEASE_DOC_CLEANUP_AND_KR9.1_COMPATIBILITY=PASS')
          print('WARNING: synthetic executable deliberately corrupted. Never publish.')
          PY
