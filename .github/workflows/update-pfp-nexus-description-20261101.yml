name: Update PFP Korean Nexus OpenMW instructions (one-shot)
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/update-pfp-nexus-description-20261101.yml
permissions:
  contents: read
jobs:
  update:
    if: github.repository == 'munument1/Morrowind-OpenMW-KR'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update owned Nexus PFP description and verify result
        uses: actions/github-script@v7
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const key = (process.env.NEXUS_API_KEY || '').trim();
            if (!key) throw new Error('NEXUSMODS_API_KEY secret unavailable');
            core.setSecret(key);
            async function api(path, method='GET', body) {
              const r = await fetch('https://api.nexusmods.com'+path, {
                method, redirect: 'error',
                headers: { apikey:key, 'Content-Type':'application/json', 'User-Agent':'Morrowind-OpenMW-KR-PFP-description-fix' },
                body: body === undefined ? undefined : JSON.stringify(body)
              });
              if (!r.ok) throw new Error('Nexus '+method+' '+path+' HTTP '+r.status);
              return r.status === 204 ? null : r.json();
            }
            const account = await api('/v1/users/validate.json');
            const legacy = await api('/v1/games/morrowind/mods/60826.json');
            if (!legacy.uid) throw new Error('Missing PFP mod UID');
            if (String(account.user_id) !== String(legacy.user?.member_id)) throw new Error('Nexus API account is not owner of PFP mod 60826');
            if (!/^5\.0\.7-kr1\.0$/i.test(String(legacy.version))) throw new Error('Expected existing 5.0.7-kr1.0 version; found '+legacy.version);
            const uid = String(legacy.uid);
            const beforeData = (await api('/v3/mods/'+uid)).data;
            const before = beforeData.mod || beforeData;
            if (typeof before.description !== 'string' || !before.description.includes('Patch for Purists')) throw new Error('Cannot safely preserve previous description');
            fs.writeFileSync('nexus-pfp-60826-before.txt', before.description);
            const marker = '[b]OpenMW 설치 안내 — 2026-11-01[/b]';
            const description = [
              '[b](KR) Patch for Purists 5.0.7[/b]',
              'Patch for Purists 5.0.7 한국어 번역 패치입니다. 원본 모드와 OpenMW 한국어판이 필요합니다.',
              '[b]필수 모드[/b]',
              '[url=https://www.nexusmods.com/morrowind/mods/45096]Patch for Purists 5.0.7 원본[/url]',
              '[url=https://www.nexusmods.com/morrowind/mods/60496]OpenMW 한국어판[/url] (Windows OpenMW 0.51.0 기준)',
              '',
              marker,
              '1. OpenMW 한국어판을 설치합니다.',
              '2. Patch for Purists 5.0.7 원본을 별도 폴더에 설치합니다.',
              '3. 이 페이지의 한국어 패치를 원본 PFP 폴더에 덮어씁니다.',
              '4. OpenMW Launcher의 [b]Data Files → Data Directories[/b]에서 해당 PFP 폴더를 등록합니다.',
              '5. [b]Content Files[/b]에서 [b]Patch for Purists.esm[/b]을 활성화합니다.',
              '',
              '[b]로드 순서[/b]',
              'Morrowind.esm → Tribunal.esm → Bloodmoon.esm → Morrowind_Korean_ReTranslation.esp → Patch for Purists.esm',
              '기본적으로 한국어 ReTranslation 뒤에 한국어 PFP를 로드해 PFP의 버그 수정을 우선 적용합니다. 중복 레코드의 표시 문자열은 모드 구성에 따라 달라질 수 있습니다.',
              '',
              '[b]참고[/b]',
              'OpenMW에서는 MWSE 및 Morrowind Code Patch(MCP)가 필요하지 않습니다.',
              '게임 진행 중 추가·제거·업데이트 전에는 세이브 파일을 백업하세요.',
              '본 파일은 원본 Patch for Purists 전체를 포함하지 않는 한국어 번역 패치입니다.',
              '',
              '[b]원본 및 크레딧[/b]',
              '[url=https://www.nexusmods.com/morrowind/mods/45096]Patch for Purists 원본 및 제작자 안내[/url]',
              '[url=https://github.com/munument1/Morrowind-OpenMW-KR]OpenMW 한국어판 GitHub[/url]'
            ].join('\n');
            fs.writeFileSync('nexus-pfp-60826-proposed.txt', description);
            if (before.description === description) {
              core.notice('Nexus PFP description already matches proposed text');
            } else {
              await api('/v3/mods/'+uid, 'PATCH', { description });
              const afterData = (await api('/v3/mods/'+uid)).data;
              const after = afterData.mod || afterData;
              if (typeof after.description !== 'string' || !after.description.includes(marker) || after.description.includes('Separate axe inventory sounds')) {
                throw new Error('Nexus description readback verification failed');
              }
              core.info('Nexus PFP #60826 OpenMW instructions updated and verified');
            }
            await core.summary.addHeading('Nexus PFP #60826 Description').addRaw('Backup and proposed text preserved. Install instructions use OpenMW, data directory registration, and Content Files activation.').write();
      - name: Preserve description backup and proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pfp-description-20261101
          path: nexus-pfp-60826-*.txt
          if-no-files-found: warn
