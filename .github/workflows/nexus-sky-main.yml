name: Skyrim Home of the Nords translation data validation

on:
  pull_request:
    paths: ['translations/sky-main/**', '.github/workflows/nexus-sky-main.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate translation data without publishing mod files
        run: python translations/sky-main/build.py --check-only
