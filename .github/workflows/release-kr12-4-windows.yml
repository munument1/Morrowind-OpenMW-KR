name: Release KR12.4 Windows cumulative Korean edition

on:
  push:
    branches:
      - fix/issue42-korean-predicate-topic-boundaries-20261031
    paths:
      - packaging/korean/tooling/package_kr12_4_windows.py
      - .github/workflows/release-kr12-4-windows.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: kr124-windows-integrated-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TAG: openmw-0.51.0-kr12.4
  BASE_TAG: openmw-0.51.0-kr12.3.1
  BASE_ZIP: Morrowind-Korean-OpenMW-0.51.0-KR12.3.1-Full.zip
  FINAL_ZIP: Morrowind-Korean-OpenMW-0.51.0-KR12.4-Full.zip
  REPORT: KR12.4-Windows-release-verification.json

jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OpenMW/openmw
          ref: openmw-0.51.0
          path: upstream
          fetch-depth: 1
      - name: Pin official OpenMW 0.51.0, verify patch chain and Python
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = f4bec41444214a7903bebd178389ca22ca13f646
          grep -Fx 'set(OPENMW_VERSION_MINOR 51)' upstream/CMakeLists.txt
          for patch in korean/patches/*.patch; do
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          grep -F futureVerbEndings upstream/apps/openmw/mwdialogue/keywordsearch.cpp
          grep -F zeroCodaNounEndings upstream/apps/openmw/mwdialogue/keywordsearch.cpp
          git -C upstream diff --check
          python3 -m py_compile packaging/korean/tooling/package_kr12_4_windows.py
          python3 -m unittest discover -s packaging/korean/tooling -p 'test_issue42_explicit_markup.py' -v
          python3 -m unittest discover -s packaging/korean/tooling -p 'test_issue42_audenian_alias.py' -v
          python3 -m unittest discover -s packaging/korean/tooling -p 'test_issue42_original_masters.py' -v
      - name: Compile and test real KeywordSearch
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -I. \
            packaging/korean/tooling/verify-issue42-topic-endings.cpp \
            apps/openmw/mwdialogue/keywordsearch.cpp \
            components/translation/translation.cpp \
            components/files/collections.cpp \
            components/files/multidircollection.cpp \
            components/files/conversion.cpp \
            components/toutf8/toutf8.cpp \
            components/debug/debuglog.cpp \
            -o /tmp/verify-issue42
          /tmp/verify-issue42

  build-windows:
    needs: source-qa
    uses: ./.github/workflows/windows.yml
    with:
      image: '2022'
      msvc: '2022'
      build-type: Release
      package: false
      release: false
      source_repository: OpenMW/openmw
      source_ref: f4bec41444214a7903bebd178389ca22ca13f646
      korean_overlay: true
      store_runtime_executable: true
    secrets: inherit

  publish-github:
    needs: [source-qa, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify release is not already published
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::KR12.4 release exists. Refusing overwrite."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: korean-runtime-executable-${{ github.sha }}
          path: engine
      - name: Download and verify published KR12.3.1
        run: |
          set -euo pipefail
          mkdir -p source output
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_ZIP" --pattern "$BASE_ZIP.sha256" --dir source
          (cd source && sha256sum -c "$BASE_ZIP.sha256")
          test -s engine/openmw.exe
      - name: Build and verify full KR12.4 update with original installer
        run: |
          set -euo pipefail
          python3 packaging/korean/tooling/package_kr12_4_windows.py \
            --baseline "source/$BASE_ZIP" \
            --engine engine/openmw.exe \
            --manifest packaging/korean/tooling/issue42_original_english_12_quest_link_manifest.json \
            --output "output/$FINAL_ZIP" \
            --report "output/$REPORT"
          unzip -tq "output/$FINAL_ZIP"
          (cd output && sha256sum -c "$FINAL_ZIP.sha256")
          python3 - <<'PY'
          import json,os
          d=json.load(open('output/'+os.environ['REPORT']))
          assert d['changed_INFO_NAME_count']==91
          assert d['changed_TOP_aliases']==3
          assert d['patched_esp_sha256']=='2276384ad93fd3e56bc0d401aacc45418ba38993ee798e0e1a7e09564a375d3a'
          assert d['patched_top_sha256']=='0516f17495afbdf5e3712d40aad9f11dc314edc7bd75ef33c9a8018b5fc60b16'
          assert d['zip_crc_integrity']=='PASS'
          assert d['all_other_TES3_fields_byte_identical']
          assert d['all_displayed_Korean_unchanged']
          assert not d['live_gameplay_verified']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KR12.4-Windows-Cumulative-Full-Verified
          path: |
            output/Morrowind-Korean-OpenMW-0.51.0-KR12.4-Full.zip
            output/Morrowind-Korean-OpenMW-0.51.0-KR12.4-Full.zip.sha256
            output/KR12.4-Windows-release-verification.json
          if-no-files-found: error
      - name: Publish complete Windows KR12.4 GitHub release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::KR12.4 appeared concurrently. Refusing overwrite."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## OpenMW 0.51.0 한국어 KR12.4 — Windows x64 통합 업데이트

          KR12.3.1 누적 업데이트입니다. 별도의 이슈 #42 전용 패치를 설치할 필요가 없습니다.

          - 공식 OpenMW 0.51.0 기반 한국어 엔진 재빌드 및 동사 어미·서술격·호격 토픽 인식 보강
          - 원본 영어 대조를 거친 퀘스트 대사 명시 토픽 링크 12건 복구
          - 기존 잘못된 명시 링크 79건 교정(설원곰·설원늑대 포함)
          - 아우데니안 발리우스의 토픽 별칭 3건 연결 수정
          - 설치 파일과 기존 다른 게임 데이터·퀘스트 조건·스크립트 유지

          설치 전 OpenMW 폴더, 설정 및 세이브를 백업하고 기존과 동일하게 Install-Korean.bat을 실행하세요. 정품 Morrowind 원본 데이터가 필요합니다.

          원본 데이터 해시 대조, ZIP CRC, 변경 대상 91 INFO.NAME/3 별칭, 다른 레코드·화면 문구 보존, 네이티브 엔진 회귀 검증, 공식 0.51.0 Windows 빌드를 통과했습니다. SHA와 결과는 첨부 검증 JSON을 참고하세요.

          **미검증:** 실제 게임에서 모든 NPC·퀘스트 단계의 토픽 습득이 확인된 것은 아닙니다. 이슈 #42의 후보 219줄/51개 토픽 전체를 해결했다고 주장하지 않습니다. 추가 제보는 이슈 #42로 부탁드립니다.

          **Windows 전용:** Android는 별도 네이티브 빌드가 필요하며 이 릴리스에 포함되지 않습니다.
          EOF
          gh release create "$TAG" \
            "output/$FINAL_ZIP" "output/$FINAL_ZIP.sha256" "output/$REPORT" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'OpenMW 0.51.0 한국어 KR12.4 — 토픽 링크 수정 (Windows x64)' \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" --latest
