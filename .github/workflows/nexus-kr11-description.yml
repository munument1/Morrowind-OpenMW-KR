name: Update Nexus KR12 Windows and Android release information

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare and verify the page update without writing to Nexus
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  update-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify both releases and prepare the Nexus description
        uses: actions/github-script@v7
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const fs = require('fs');
            const key = (process.env.NEXUS_API_KEY || '').trim();
            if (!key) throw new Error('Missing configured Nexus API key');
            core.setSecret(key);
            const winTag = 'openmw-0.51.0-kr12';
            const androidTag = 'android-korean-0.51.0-12-kr12-permanent';
            const win = (await github.rest.repos.getReleaseByTag({owner:'munument1',repo:'Morrowind-OpenMW-KR',tag:winTag})).data;
            const android = (await github.rest.repos.getReleaseByTag({owner:'munument1',repo:'Morrowind-OpenMW-Android-KR',tag:androidTag})).data;
            for (const release of [win,android]) {
              if (release.draft || release.prerelease) throw new Error('Both KR12 releases must be published stable releases');
            }
            const required = ['OpenMW-Android-0.51.0-12-Korean-KR12-Permanent-16K.apk','OpenMW-Android-0.51.0-12-Korean-Data-KR12.zip'];
            for (const name of required) {
              if (!android.assets.some(a => a.name === name && a.state === 'uploaded') || !android.assets.some(a => a.name === name+'.sha256')) throw new Error('Missing verified Android release asset: '+name);
            }
            async function api(path,method='GET',body) {
              const response = await fetch('https://api.nexusmods.com'+path,{method,headers:{apikey:key,'Content-Type':'application/json','User-Agent':'OpenMW-Korean-KR12-release-sync'},body:body===undefined?undefined:JSON.stringify(body),redirect:'error'});
              if (!response.ok) throw new Error(`Nexus ${method} ${path}: HTTP ${response.status}`);
              return response.json();
            }
            const user = await api('/v1/users/validate.json');
            const legacyMod = await api('/v1/games/morrowind/mods/60496.json');
            if (String(user.user_id) !== String(legacyMod.user?.member_id)) throw new Error('API account is not the configured mod owner');
            const uid = String(legacyMod.uid);
            const current = (await api(`/v3/mods/${uid}`)).data;
            const mod = current.mod || current;
            if (typeof mod.description !== 'string') throw new Error('Missing current description for reversible update');
            const files = (await api(`/v3/mods/${uid}/files`)).data.mod_files;
            let windowsUploaded = false;
            for (const file of files.filter(f => f.is_active)) {
              const versions = (await api(`/v3/mod-files/${file.id}/versions`)).data.versions;
              if (versions.some(v => v.version === '0.51.0-KR12')) windowsUploaded = true;
            }
            if (!windowsUploaded) throw new Error('Windows KR12 must be uploaded to Nexus before updating the page');
            const heading = '[b]KR12 출시 안내 — 2026-10-29[/b]';
            const notice = [heading,
              'Windows와 Android/ChromeOS 한국어 지원판 KR12입니다. 정품 Morrowind 게임 데이터는 별도로 필요합니다.',
              '[b]Windows KR12[/b]',
              '한국어 단어 내부에서 잘못 발견되던 토픽을 보정하고, 일반적인 “일”이 업무 토픽으로 연결되는 문제를 수정했습니다. 번역 데이터 468개 INFO 필드에서 검토한 오연결·이름 분절을 고치고 실제 업무 의뢰 진입 링크는 보강했습니다. KR11 로마 숫자 폰트 수정과 원래 데이드릭 글리프는 유지합니다.',
              `[url=${win.html_url}]Windows KR12 ZIP 및 SHA-256[/url]`,
              '[b]Android KR12[/b]',
              'Windows KR10의 조사·구형 토픽 복구와 KR12 링크 수정을 이식한 새 ARM64 APK입니다. 데이드릭 슬롯은 원래 DemonicLetters 폰트로 복구했습니다. 수정된 한국어 데이터 KR12 ZIP도 함께 적용하세요.',
              '앱 식별자 com.ast.openmw.korean, versionCode 5114, 영구 릴리스 서명을 사용합니다. 기존 KR8(com.ast.openmw) 및 초기 KR9(com.ast.openmw.kr9)를 삭제하거나 덮어쓰지 않습니다. 게임 데이터 경로를 새 앱에서 설정하고 세이브는 백업 후 수동으로 옮기세요.',
              `[url=${android.html_url}]Android KR12 APK·데이터 ZIP 및 SHA-256[/url]`,
              '[b]검증 범위[/b]',
              'Windows에서 한국어 토픽·저널과 로마 숫자·데이드릭 표시를 검사했습니다. Android는 네이티브 컴파일, 토픽/저널 C++ 회귀 검사, Gradle 검사, 서명과 16KiB 정렬 검증을 수행했습니다. Android 기기 전체 플레이 검증을 완료했다고 주장하지 않습니다.',
              'Rebirth 모드 ESP는 이 본편 배포에 포함되지 않습니다. Rebirth의 토픽 연결 및 Daedric 번역 수정은 별도 로컬 검증 대상입니다.'
            ].join('\n\n');
            const summary = 'OpenMW 0.51.0 한국어 지원 KR12. 대화·저널의 잘못된 토픽 링크와 번역 링크를 수정했습니다. Windows 및 영구 서명 Android ARM64 APK·데이터 제공. 로마 숫자·데이드릭 문자 지원. 정품 게임 데이터 별도 필요.';
            const description = mod.description.startsWith(heading) ? mod.description : notice+'\n\n[spoiler=기존 소개 및 크레딧 (이전 버전 안내 포함)]\n'+mod.description+'\n[/spoiler]';
            fs.writeFileSync('nexus-description-before-kr12.txt',mod.description);
            fs.writeFileSync('nexus-description-proposed-kr12.txt',description);
            fs.writeFileSync('nexus-kr12-request.json',JSON.stringify({summary,description},null,2));
            if (process.env.DRY_RUN !== 'true') {
              await api(`/v3/mods/${uid}`,'PATCH',{summary,description});
              const afterData=(await api(`/v3/mods/${uid}`)).data;
              const after=afterData.mod || afterData;
              if (!after.description.startsWith(heading)) throw new Error('Updated Nexus description readback mismatch');
              core.info('Nexus KR12 description update and readback PASS');
            } else core.info('Nexus KR12 description prepared; dry run only.');
            await core.summary.addHeading('Nexus KR12 information').addRaw(`Windows release: ${win.html_url}\nAndroid release: ${android.html_url}\nDry run: ${process.env.DRY_RUN}`).write();
      - name: Preserve previous and proposed public page text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-kr12-description-evidence
          path: nexus-*.txt
          if-no-files-found: warn
