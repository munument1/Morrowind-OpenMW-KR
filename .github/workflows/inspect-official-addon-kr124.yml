name: Inspect archived Official Add-ons Korean patch for KR12.4

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/inspect-official-addon-kr124.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download pinned KR3 official add-ons translation and KR12.4 full archive
        run: |
          mkdir -p old current
          gh release download openmw-0.51.0-kr3 --repo "$GITHUB_REPOSITORY" --pattern 'Morrowind_OfficialAddon_KR.zip' --dir old
          gh release download openmw-0.51.0-kr12.4 --repo "$GITHUB_REPOSITORY" --pattern 'Morrowind-Korean-OpenMW-0.51.0-KR12.4-Full.zip' --dir current
      - name: Verify SHA and inspect safe archive contents without altering release
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          old=Path('old/Morrowind_OfficialAddon_KR.zip')
          new=Path('current/Morrowind-Korean-OpenMW-0.51.0-KR12.4-Full.zip')
          for p, expected in [(old,'404dfe169203bdec679ec67d456aa7516421298dbec89620331a6af931bbe79f'),
                              (new,'71fbbd1ae5506df4444fe47f31b29101f010a96fa5d73bb4b8699977cd211497')]:
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual==expected, f'SHA mismatch for {p}'
              print(p, len(p.read_bytes()), actual)
          with zipfile.ZipFile(old) as z:
              assert z.testzip() is None
              names=z.namelist()
              print('OLD ZIP CONTENTS:')
              for info in z.infolist():
                  print(info.filename,info.file_size,'CRC',hex(info.CRC))
                  assert not info.filename.startswith('/') and '..' not in Path(info.filename).parts
              assert any(n.lower().endswith('morrowind_officialaddon_kr.esp') for n in names)
          with zipfile.ZipFile(new) as z:
              assert z.testzip() is None
              relevant=[n for n in z.namelist() if ('official' in n.lower() or 'addon' in n.lower())]
              print('KR12.4 matching paths:',relevant)
          PY
