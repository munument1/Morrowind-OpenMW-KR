name: Release

on:
  push:
      tags:
        - openmw-**
        # KR13 uses its own verified Windows/Korean release packaging.
        # Do not run the upstream generic Windows/Mac release on this tag.
        - '!openmw-0.51.0-kr13'

jobs:
  Windows:
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      build-type: Release
      package: true
      release: true
    secrets: inherit
  MacOS:
    strategy:
      fail-fast: true
      matrix:
        args:
          - image: macos-15
          - image: macos-15-intel
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}
      build-type: Release
