name: Build standalone Windows KR native topic parser for full audit
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-windows-native-topic-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile exact OpenMW 0.51 Korean dialogue keyword parser
        shell: cmd
        run: |
          cl /nologo /std:c++20 /O2 /EHsc /MD /I. /Iapps\openmw\mwdialogue ^
            packaging\korean\tooling\verify-journal-links.cpp ^
            apps\openmw\mwdialogue\keywordsearch.cpp ^
            components\translation\translation.cpp ^
            components\files\collections.cpp ^
            components\files\multidircollection.cpp ^
            components\files\conversion.cpp ^
            components\toutf8\toutf8.cpp ^
            components\debug\debuglog.cpp ^
            /Fe:openmw-kr-native-topic-auditor.exe
          if errorlevel 1 exit /b 1
      - name: Verify native executable and preserve SHA
        shell: pwsh
        run: |
          if (!(Test-Path .\openmw-kr-native-topic-auditor.exe)) { throw 'Missing executable' }
          $hash=(Get-FileHash .\openmw-kr-native-topic-auditor.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "EXACT_NATIVE_OPENMW_WINDOWS_EXE_SHA256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: openmw-kr-windows-native-topic-auditor
          path: openmw-kr-native-topic-auditor.exe
          retention-days: 4
          if-no-files-found: error
