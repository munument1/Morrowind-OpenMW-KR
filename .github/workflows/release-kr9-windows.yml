name: Build and publish verified Windows KR9

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-kr9-windows.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-windows-kr9:
    uses: ./.github/workflows/windows.yml
    with:
      image: '2022'
      msvc: '2022'
      build-type: Release
      package: false
      release: false
      store_runtime_executable: true
    secrets: inherit

  verify-and-publish-kr9:
    needs: build-windows-kr9
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: openmw-0.51.0-kr9
      SOURCE_TAG: openmw-0.51.0-kr8
      SOURCE_ASSET: Morrowind-Korean-OpenMW-0.51.0-KR8-Full.zip
      OUTPUT_ASSET: Morrowind-Korean-OpenMW-0.51.0-KR9-Full.zip
    steps:
      - uses: actions/checkout@v4
      - name: Download tested Windows executable
        uses: actions/download-artifact@v6
        with:
          name: korean-runtime-executable-${{ github.sha }}
          path: runtime

      - name: Fetch verified KR8 release data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input output
          gh release download "$SOURCE_TAG" --pattern "$SOURCE_ASSET" --dir input
          gh release download "$SOURCE_TAG" --pattern "$SOURCE_ASSET.sha256" --dir input
          (cd input && sha256sum --check "$SOURCE_ASSET.sha256")
          test -s runtime/openmw.exe
          file runtime/openmw.exe

      - name: Package new runtime without changing any KR8 translation data
        id: package
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk 'NR==1{print $1}' "input/$SOURCE_ASSET.sha256")"
          python3 packaging/korean/tooling/package_kr9_windows.py \
            --source "input/$SOURCE_ASSET" \
            --executable runtime/openmw.exe \
            --output "output/$OUTPUT_ASSET" \
            --expected-source-sha256 "$expected" \
            | tee output/kr9-verification.json
          (cd output && sha256sum --check "$OUTPUT_ASSET.sha256")
          unzip -tq "output/$OUTPUT_ASSET"

      - name: Retain verified KR9 Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Morrowind-Korean-OpenMW-0.51.0-KR9-Windows
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish KR9 Windows release only on master
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::KR9 release exists: refusing overwrite"
            exit 1
          fi
          cat > output/notes.md <<'EOF'
          ## OpenMW 0.51.0 Korean Support KR9

          - Fix unintended blue hyperlinks inside Korean dialogue, NPC greetings, persuasion responses and journal text.
          - Preserve explicit dialogue topics, legitimate Korean particles and longer multi-word topic names.
          - Preserve all KR8 translation data including the Aradraen official-add-on CELL correction.
          - Windows/Ubuntu engine tests, real OpenMW parser integration tests and 25,641-record KR8 translation audit passed before packaging.
          - Verified the release ZIP differs from KR8 **only** in `payload/openmw.exe`; full ZIP SHA-256 and executable hashes are available in the packaged verification report.

          In-game testing was intentionally waived for this release. This Windows package does not imply that the Android engine has been updated.
          EOF
          gh release create "$RELEASE_TAG" \
            "output/$OUTPUT_ASSET" "output/$OUTPUT_ASSET.sha256" \
            --title 'OpenMW 0.51.0 Korean Support KR9 — Korean dialogue and journal hyperlink fix' \
            --notes-file output/notes.md --target "$GITHUB_SHA" --latest
