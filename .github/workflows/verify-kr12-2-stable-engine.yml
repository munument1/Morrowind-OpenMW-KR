name: KR12.2 — verify stable 0.51 Korean engine port

on:
  push:
    branches: [fix/kr12-2-openmw-051-port]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  stable-source-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout official stable OpenMW 0.51.0
        uses: actions/checkout@v4
        with:
          repository: OpenMW/openmw
          ref: openmw-0.51.0
          fetch-depth: 1
      - name: Checkout Korean patch source separately
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: _korean_port
      - name: Confirm stable source and apply full Korean patchset
        shell: bash
        run: |
          set -o pipefail
          {
          set -e
          grep -F 'set(OPENMW_VERSION_MINOR 51)' CMakeLists.txt
          for patch in _korean_port/korean/patches/*.patch; do
            echo "::group::Applying $(basename "$patch")"
            git apply --check "$patch"
            git apply "$patch"
            echo "::endgroup::"
          done
          grep -F 'set(OPENMW_VERSION_MINOR 51)' CMakeLists.txt
          git diff --check
          } 2>&1 | tee stable-patch-check.log
      - name: Record incompatible patch details on draft PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Stable OpenMW 0.51.0 patch compatibility failed."
            echo ""
            echo "Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo '```text'
            tail -n 55 stable-patch-check.log 2>/dev/null || true
            echo '```'
          } > stable-port-diagnostic.md
          gh pr comment 39 --body-file stable-port-diagnostic.md

  build-stable-engine:
    needs: stable-source-check
    uses: ./.github/workflows/windows.yml
    with:
      image: '2022'
      msvc: '2022'
      build-type: Release
      package: false
      release: false
      source_repository: OpenMW/openmw
      source_ref: openmw-0.51.0
      korean_overlay: true
      store_runtime_executable: true
    secrets: inherit

  package-test-candidate:
    needs: [stable-source-check, build-stable-engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_TAG: openmw-0.51.0-kr12.1
      BASE_ZIP: Morrowind-Korean-OpenMW-0.51.0-KR12.1-Full.zip
      TEST_ZIP: Morrowind-Korean-OpenMW-0.51.0-KR12.2-TEST.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download newly built stable OpenMW 0.51.0 Korean runtime
        uses: actions/download-artifact@v4
        with:
          name: korean-runtime-executable-${{ github.sha }}
          path: engine
      - name: Download verified KR12.1 data-only baseline
        run: |
          set -euo pipefail
          mkdir -p input output
          gh release download "$BASE_TAG" --pattern "$BASE_ZIP" --dir input
          gh release download "$BASE_TAG" --pattern "$BASE_ZIP.sha256" --dir input
          (cd input && sha256sum -c "$BASE_ZIP.sha256")
      - name: Create auditable Windows KR12.2 test candidate
        run: |
          set -euo pipefail
          python3 packaging/korean/tooling/package_kr12_2_stable_windows.py \
            --baseline "input/$BASE_ZIP" \
            --engine engine/openmw.exe \
            --output "output/$TEST_ZIP" \
            --report output/KR12.2-Stable051-Test-Verification.json
          unzip -tq "output/$TEST_ZIP"
          (cd output && sha256sum -c "$TEST_ZIP.sha256")
      - name: Keep TEST artifact only; never publish official release
        uses: actions/upload-artifact@v4
        with:
          name: KR12.2-Stable051-Windows-TEST-not-official
          path: |
            output/Morrowind-Korean-OpenMW-0.51.0-KR12.2-TEST.zip
            output/Morrowind-Korean-OpenMW-0.51.0-KR12.2-TEST.zip.sha256
            output/KR12.2-Stable051-Test-Verification.json
          retention-days: 14
      - name: Link completed test candidate in the draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "**KR12.2 OpenMW 0.51.0 TEST ZIP built (not official).**"
            echo ""
            echo "Download the KR12.2-Stable051-Windows-TEST-not-official artifact from:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "The ZIP includes the matching 0.51.0 Korean executable and KR12.1 translation data."
            echo "Manual Windows gameplay testing has not been performed."
          } > test-artifact.md
          gh pr comment 39 --body-file test-artifact.md
