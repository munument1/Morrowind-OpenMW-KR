name: Update Nexus KR11 Windows and Android release information

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare and verify the page update without writing to Nexus
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  update-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify both releases and prepare the Nexus description
        uses: actions/github-script@v7
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const fs = require('fs');
            const key = (process.env.NEXUS_API_KEY || '').trim();
            if (!key) throw new Error('Missing configured Nexus API key');
            core.setSecret(key);
            const winTag = 'openmw-0.51.0-kr11';
            const androidTag = 'android-korean-0.51.0-12-kr11-permanent';
            const win = (await github.rest.repos.getReleaseByTag({owner:'munument1',repo:'Morrowind-OpenMW-KR',tag:winTag})).data;
            const android = (await github.rest.repos.getReleaseByTag({owner:'munument1',repo:'Morrowind-OpenMW-Android-KR',tag:androidTag})).data;
            for (const release of [win,android]) {
              if (release.draft || release.prerelease) throw new Error('Both KR11 releases must be published stable releases');
            }
            const required = ['OpenMW-Android-0.51.0-12-Korean-KR11-Permanent-16K.apk','OpenMW-Android-0.51.0-12-Korean-Data-KR11.zip'];
            for (const name of required) {
              if (!android.assets.some(a => a.name === name && a.state === 'uploaded') || !android.assets.some(a => a.name === name+'.sha256')) throw new Error('Missing verified Android release asset: '+name);
            }
            async function api(path,method='GET',body) {
              const response = await fetch('https://api.nexusmods.com'+path,{method,headers:{apikey:key,'Content-Type':'application/json','User-Agent':'OpenMW-Korean-KR11-release-sync'},body:body===undefined?undefined:JSON.stringify(body),redirect:'error'});
              if (!response.ok) throw new Error(`Nexus ${method} ${path}: HTTP ${response.status}`);
              return response.json();
            }
            const user = await api('/v1/users/validate.json');
            const legacyMod = await api('/v1/games/morrowind/mods/60496.json');
            if (String(user.user_id) !== String(legacyMod.user?.member_id)) throw new Error('API account is not the configured mod owner');
            const uid = String(legacyMod.uid);
            const current = (await api(`/v3/mods/${uid}`)).data;
            const mod = current.mod || current;
            if (typeof mod.description !== 'string') throw new Error('Missing current description for reversible update');
            const files = (await api(`/v3/mods/${uid}/files`)).data.mod_files;
            let windowsUploaded = false;
            for (const file of files.filter(f => f.is_active)) {
              const versions = (await api(`/v3/mod-files/${file.id}/versions`)).data.versions;
              if (versions.some(v => v.version === '0.51.0-KR11')) windowsUploaded = true;
            }
            if (!windowsUploaded) throw new Error('Windows KR11 must be uploaded to Nexus before updating the page');
            const heading = '[b]KR11 출시 안내 — 2026-10-28[/b]';
            const notice = [heading,
              'Windows와 Android/ChromeOS 한국어 지원판 KR11입니다. 정품 Morrowind 게임 데이터는 별도로 필요합니다.',
              '[b]Windows KR11[/b]',
              'Ⅰ·Ⅺ·Ⅻ 등 로마 숫자가 밑줄로 표시되던 폰트 문자 범위를 보완했습니다. KR10 엔진, 한국어 ESP·토픽 매핑·자막·TTF는 그대로 유지합니다.',
              `[url=${win.html_url}]Windows KR11 ZIP 및 SHA-256[/url]`,
              '[b]Android KR11[/b]',
              'Windows KR10의 정상 조사 및 구형 알려진 토픽/저널 토픽 복구 패치까지 이식한 새 ARM64 APK입니다. KR11 폰트 데이터 ZIP도 함께 적용하세요.',
              '앱 식별자 com.ast.openmw.korean, versionCode 5113, 영구 릴리스 서명을 사용합니다. 기존 KR8(com.ast.openmw) 및 초기 KR9(com.ast.openmw.kr9)를 삭제하거나 덮어쓰지 않습니다. 게임 데이터 경로를 새 앱에서 설정하고 세이브는 백업 후 수동으로 옮기세요.',
              `[url=${android.html_url}]Android KR11 APK·데이터 ZIP 및 SHA-256[/url]`,
              '[b]검증 범위[/b]',
              'Windows에서 로마 숫자와 한글 렌더링을 실제 확인했습니다. Android는 네이티브 컴파일, 토픽/저널 C++ 회귀 검사, Gradle 검사, 서명과 16KiB 정렬 검증을 수행했습니다. Android 기기 전체 플레이 검증을 완료했다고 주장하지 않습니다.',
              'Rebirth 모드 ESP는 이 본편 배포에 포함되지 않습니다. Rebirth의 토픽 연결 및 Daedric 번역 수정은 별도 로컬 검증 대상입니다.'
            ].join('\n\n');
            const summary = 'OpenMW 0.51.0 한국어 지원 KR11. Windows 로마 숫자 폰트 수정, Android KR10 토픽 복구 이식·영구 서명 ARM64 APK와 KR11 데이터 제공. 정품 게임 데이터 별도 필요.';
            const description = mod.description.startsWith(heading) ? mod.description : notice+'\n\n[spoiler=기존 소개 및 크레딧 (이전 버전 안내 포함)]\n'+mod.description+'\n[/spoiler]';
            fs.writeFileSync('nexus-description-before-kr11.txt',mod.description);
            fs.writeFileSync('nexus-description-proposed-kr11.txt',description);
            fs.writeFileSync('nexus-kr11-request.json',JSON.stringify({summary,description},null,2));
            if (process.env.DRY_RUN !== 'true') {
              await api(`/v3/mods/${uid}`,'PATCH',{summary,description});
              const afterData=(await api(`/v3/mods/${uid}`)).data;
              const after=afterData.mod || afterData;
              if (!after.description.startsWith(heading)) throw new Error('Updated Nexus description readback mismatch');
              core.info('Nexus KR11 description update and readback PASS');
            } else core.info('Nexus KR11 description prepared; dry run only.');
            await core.summary.addHeading('Nexus KR11 information').addRaw(`Windows release: ${win.html_url}\nAndroid release: ${android.html_url}\nDry run: ${process.env.DRY_RUN}`).write();
      - name: Preserve previous and proposed public page text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-kr11-description-evidence
          path: nexus-*.txt
          if-no-files-found: warn
