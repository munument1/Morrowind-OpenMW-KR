name: Audit Morrowind KR12.6 and all mod translation topic data (read only)
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/audit-all-morrowind-links.yml
      - packaging/korean/tooling/audit_cross_mod_topic_gaps.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch immutable official core KR12.6 archive
        run: |
          set -euo pipefail
          mkdir -p input output
          gh release download openmw-0.51.0-kr12.6 --repo "$GITHUB_REPOSITORY" --pattern 'Morrowind-Korean-OpenMW-0.51.0-KR12.6-Full.zip' --dir input
          echo '2f4bb6b9cfd5916fd9574b6207628e4bb16f8bdc4f1c68fc1ef7581c970989e9  input/Morrowind-Korean-OpenMW-0.51.0-KR12.6-Full.zip' | sha256sum -c -
      - name: Run prior comprehensive lexical audit on current core instead of obsolete KR12.2
        run: |
          set -euo pipefail
          python packaging/korean/tooling/audit_kr12_gamewide_topics.py \
            --zip input/Morrowind-Korean-OpenMW-0.51.0-KR12.6-Full.zip \
            --output output/core_kr126_legacy_scan.json --examples 10000 > output/core_legacy_stdout.txt
          python3 - <<'PY'
          import json
          d=json.load(open('output/core_kr126_legacy_scan.json'))
          print('CORE_LEGACY_SUMMARY='+json.dumps({k:v for k,v in d.items() if k in ('topic_count','info_count','additional_missing_suffix_candidates','top_unhandled_suffixes','top_candidate_topics','top_candidate_dialogues','top_candidate_actors','limitations')},ensure_ascii=False)[:10000])
          PY
      - name: Inspect released mod ZIPs and cross-mod data schemas without modifying originals
        run: |
          python3 - <<'PY'
          import gzip, json, pathlib
          paths=[
            'translations/openmw-kr/cyr-main/26.09a/strings.jsonl.gz',
            'translations/openmw-kr/sky-main/26.09a/strings.jsonl.gz',
            'translations/openmw-kr/tamriel-data/26.08/strings.jsonl.gz',
            'translations/tamriel-rebuilt/26.11.2-kr0.1/TR_Mainland.en_ko.jsonl.gz',
            'translations/openmw-kr/cyr-main/26.09a/topic_link_overlay_20261102.jsonl.gz',
            'translations/openmw-kr/sky-main/26.09a/topic_link_overlay_20261102.jsonl.gz',
            'translations/openmw-kr/tamriel-data/26.08/topic_link_overlay_20261102.jsonl.gz',
            'translations/tamriel-rebuilt/26.11.2-kr0.1/topic_link_overlay_20261102.jsonl.gz',
            'translations/openmw-kr/rebirth-compat/7.2/cyr_compatch_translation_delta.jsonl.gz',
            'translations/openmw-kr/rebirth-compat/7.2/sky_compatch_translation_delta.jsonl.gz',
          ]
          result=[]
          for name in paths:
            p=pathlib.Path(name)
            if not p.exists():
              result.append({'path':name,'status':'MISSING'})
              continue
            with gzip.open(p,mode='rt',encoding='utf-8') as f:
              first=json.loads(next(f))
              second=json.loads(next(f))
            result.append({'path':name,'bytes':p.stat().st_size,'first':first,'second_keys':list(second)})
          pathlib.Path('output/mod_schemas.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf8')
          for x in result:
            print('SCHEMA '+json.dumps({'path':x['path'],'size':x.get('bytes'),'keys':list(x.get('first',{})),'sample':{k:str(v)[:300] for k,v in x.get('first',{}).items() if k in ('record_type','field','ko','en','status','parent','dialogue_topic','topic','translated_text','english','after','new_text','original_text','record_id','row_key','source_index','record_index','subrecord_index','mod')}},ensure_ascii=False))
          PY
      - name: Try retaining existing published Rebirth and PFP mod ZIPs as QA input
        run: |
          mkdir -p input/reviewed-mods
          if gh run download 41323412147 --repo "$GITHUB_REPOSITORY" --name reviewed-mod-translations-kr11-publication --dir input/reviewed-mods; then
            find input/reviewed-mods -maxdepth 2 -type f -printf 'REVIEWED_MOD_ARCHIVE %P %s bytes\n' | head -40
          else
            echo 'REVIEWED_MOD_ARCHIVE_NOT_AVAILABLE; continuing with source-backed dataset only'
          fi
      - name: Inspect real Korean topics across core, regional, Rebirth compatibility, Rebirth and PFP data
        run: |
          set -euo pipefail
          python3 -m py_compile packaging/korean/tooling/audit_cross_mod_topic_gaps.py
          python3 packaging/korean/tooling/audit_cross_mod_topic_gaps.py \
            --repo . \
            --core-zip input/Morrowind-Korean-OpenMW-0.51.0-KR12.6-Full.zip \
            --reviewed-mods-dir input/reviewed-mods \
            --output output/cross_mod_kr126_topic_risk_audit.json > output/cross_mod_stdout.txt
          grep '^CROSS_MOD_SUMMARY=' output/cross_mod_stdout.txt | cut -c1-18000
          grep '^CROSS_MOD_HIGH_EXAMPLES=' output/cross_mod_stdout.txt | head -10 | cut -c1-6500
      - name: Compile the actual KR12.6 native OpenMW topic parser
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -I. -Iapps/openmw/mwdialogue \
            packaging/korean/tooling/verify-journal-links.cpp \
            apps/openmw/mwdialogue/keywordsearch.cpp \
            components/translation/translation.cpp \
            components/files/collections.cpp \
            components/files/multidircollection.cpp \
            components/files/conversion.cpp \
            components/toutf8/toutf8.cpp \
            components/debug/debuglog.cpp \
            -o /tmp/verify-kr126-multimod
      - name: Confirm risk-ranked candidates with actual OpenMW parser
        run: |
          set -euo pipefail
          python3 -m py_compile packaging/korean/tooling/verify_native_topic_gap_report.py
          python3 packaging/korean/tooling/verify_native_topic_gap_report.py \
            --repo . \
            --core-zip input/Morrowind-Korean-OpenMW-0.51.0-KR12.6-Full.zip \
            --reviewed-mods-dir input/reviewed-mods \
            --report output/cross_mod_kr126_topic_risk_audit.json \
            --runner /tmp/verify-kr126-multimod \
            --output output/cross_mod_kr126_native_verification.json > output/native_verification_stdout.txt
          grep '^NATIVE_TOPIC_MOD=' output/native_verification_stdout.txt | cut -c1-11000
          grep '^NATIVE_TOPIC_SUMMARY=' output/native_verification_stdout.txt | cut -c1-14000
      - name: Cross-check high-risk source NPC with target DIAL responses (no quest simulation)
        run: |
          python3 - <<'PY'
          import collections,json,zipfile
          from pathlib import Path
          import sys
          sys.path.insert(0,"packaging/korean/tooling")
          from audit_cross_mod_topic_gaps import binary_rows
          report=json.loads(Path("output/cross_mod_kr126_native_verification.json").read_text(encoding="utf-8"))
          with zipfile.ZipFile("input/Morrowind-Korean-OpenMW-0.51.0-KR12.6-Full.zip") as zip:
            esp=zip.read(next(p for p in zip.namelist() if p.endswith("Morrowind_Korean_ReTranslation.esp")))
          _, rows=binary_rows(esp)
          topic_to_rows=collections.defaultdict(list)
          for row in rows: topic_to_rows[row["parent"]].append(row)
          confirmed=[]
          core=next(x for x in report["detail"] if x["plugin"]=="KR12.6_CORE")
          for candidate in core["records"]:
            if candidate["priority"]!="HIGH_REVIEW" or candidate["native_parser_status"]!="PARSER_NOT_DISCOVERED":continue
            target_rows=topic_to_rows.get(candidate["topic"],[])
            actor=(candidate.get("actor") or "").casefold()
            faction=(candidate.get("faction") or "").casefold()
            target_same_actor=[r for r in target_rows if actor and (r["actor"] or "").casefold()==actor]
            target_same_faction=[r for r in target_rows if faction and (r["faction"] or "").casefold()==faction]
            target_generic=[r for r in target_rows if not r["actor"] and not r["faction"]]
            source_same=[r for r in rows if r["id"]==candidate["id"] and r["parent"]==candidate["parent"]]
            source_scripts=[r["script"] for r in source_same]
            row={k:candidate.get(k) for k in ("id","parent","actor","faction","topic","suffix","context","score")}
            row.update({"target_dial_exists":bool(target_rows),
                        "target_info_count":len(target_rows),
                        "target_same_actor_INFO":len(target_same_actor),
                        "target_same_faction_INFO":len(target_same_faction),
                        "target_generic_INFO":len(target_generic),
                        "target_result_scripts":[r["script"][:240] for r in target_same_actor+target_same_faction+target_generic if r["script"]][:3],
                        "source_result_scripts":source_scripts[:3],
                        "assumption":"Even matching actor/faction does not prove SCVR/journal filter passes."})
            confirmed.append(row)
          detail={"high_priority_unrecognized_core_candidates":confirmed,
                  "regional_medium_unrecognized_candidates":{}}
          for scope in report["detail"]:
            if scope["plugin"]=="KR12.6_CORE":continue
            selected=[{k:c.get(k) for k in ("id","parent","topic","suffix","context","original_context","same_english_topic_literal","score")}
                     for c in scope["records"] if c["native_parser_status"]=="PARSER_NOT_DISCOVERED"]
            if selected: detail["regional_medium_unrecognized_candidates"][scope["plugin"]]=selected
          Path("output/native_npc_topic_evidence.json").write_text(json.dumps(detail,ensure_ascii=False,indent=2),encoding="utf-8")
          print('NATIVE_NPC_HIGH='+json.dumps(confirmed,ensure_ascii=False)[:32000])
          for mod,selected in detail["regional_medium_unrecognized_candidates"].items():
            print('NATIVE_MOD_MISSES='+json.dumps({"mod":mod,"count":len(selected),"cases":selected[:15]},ensure_ascii=False)[:13000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Morrowind-KR126-Topic-Preflight-QA
          path: |
            output/core_kr126_legacy_scan.json
            output/mod_schemas.json
            output/cross_mod_kr126_topic_risk_audit.json
            output/cross_mod_kr126_native_verification.json
            output/native_npc_topic_evidence.json
          if-no-files-found: error
