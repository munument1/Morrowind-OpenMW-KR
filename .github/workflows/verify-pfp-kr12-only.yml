name: Read back PFP 5.0.7 kr1.2 Nexus metadata (no upload)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pfp-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check owned PFP file group version and record changelog without uploading
        run: python packaging/korean/tooling/publish_pfp_kr12.py --nexus-verify --out dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-pfp-kr12-metadata-readback
          path: dist/
          retention-days: 30
