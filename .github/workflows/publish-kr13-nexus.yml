name: Publish Bloodmoon KR13.2.2 and PFP kr1.4 to Nexus

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify both release assets and Nexus file groups without uploading
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: nexus-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: Morrowind-Korean-OpenMW-0.51.0-KR13.2.2-Full.zip
            sha256: 7ed63bac9031f48f3c8bef9d01d7a5659294dc420115efc7f69f44e29fd1c895
            bytes: 14542354
            version: 0.51.0-KR13.2.2
            mod: 60496
            uid: '429496790096'
            group: '8110335'
            display: OpenMW Windows KR13.2.2
            description: '블러드문 우디르프릭테 후속 대화와 저장 불러오기 후 세쿤다 색상을 수정했습니다. PFP 사용 시 한국어판 5.0.7-kr1.4를 함께 사용하세요.'
          - asset: PFP_5.0.7-kr1.4_OpenMW-KR13.2.2.zip
            sha256: ddd15063dd24937fa8edb285b2c5420ca84a9bea8d121c88c3cfc11314655567
            bytes: 1777398
            version: 5.0.7-kr1.4
            mod: 60826
            uid: '429496790426'
            group: '8280147'
            display: PFP 5.0.7-kr1.4
            description: '스벤야의 우디르프릭테 대화와 세쿤다 색상을 수정했습니다. Windows 본편 KR13.2.2와 함께 사용하세요.'
    env:
      RELEASE_ASSET: ${{ matrix.asset }}
      RELEASE_SHA: ${{ matrix.sha256 }}
      RELEASE_BYTES: ${{ matrix.bytes }}
      NEXUS_MOD: ${{ matrix.mod }}
      NEXUS_UID: ${{ matrix.uid }}
      NEXUS_GROUP: ${{ matrix.group }}
      NEXUS_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify the release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download openmw-0.51.0-kr13.2.2 --repo "$GITHUB_REPOSITORY" --pattern "$RELEASE_ASSET"
          echo "$RELEASE_SHA  $RELEASE_ASSET" | sha256sum --check
          test "$(stat -c %s "$RELEASE_ASSET")" = "$RELEASE_BYTES"
          python3 -m zipfile --test "$RELEASE_ASSET"
      - name: Verify existing Nexus target and skip already-uploaded versions
        id: gate
        env:
          NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          PYTHONPATH: packaging/korean/tooling
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from publish_issue71_nexus import target, readback, write
          env = os.environ
          row = dict(asset=env['RELEASE_ASSET'], sha256=env['RELEASE_SHA'], bytes=int(env['RELEASE_BYTES']),
                     mod_id=int(env['NEXUS_MOD']), uid=env['NEXUS_UID'], group=env['NEXUS_GROUP'],
                     version=env['NEXUS_VERSION'])
          existing = target(row)
          if existing:
              readback(row)
          write(Path('nexus-target.json'), row)
          with open(env['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"upload={str(not existing).lower()}\n")
          PY
      - name: Upload verified archive to Nexus
        if: ${{ !inputs.dry_run && steps.gate.outputs.upload == 'true' }}
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ matrix.group }}
          filename: ${{ matrix.asset }}
          version: ${{ matrix.version }}
          display_name: ${{ matrix.display }}
          description: ${{ matrix.description }}
          category: main
          archive_existing_version: false
          primary_mod_manager_download: true
          update_mod_version: true
          allow_mod_manager_download: true
      - name: Confirm uploaded version, group, and size
        if: ${{ !inputs.dry_run }}
        env:
          NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          PYTHONPATH: packaging/korean/tooling
        run: |
          python3 - <<'PY'
          import json, time
          from pathlib import Path
          from publish_issue71_nexus import readback, write
          row = json.loads(Path('nexus-target.json').read_text())
          for attempt in range(12):
              try:
                  record = readback(row)
                  write(Path('nexus-receipt.json'), record)
                  print(json.dumps(record, ensure_ascii=False))
                  break
              except ValueError:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: Nexus-Bloodmoon-${{ matrix.mod }}
          path: nexus-receipt.json
