name: Retry Windows KR13.2.1 ZIP metadata compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-publish
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
jobs:
  windows-repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch original verified release and repack without changing payloads
        run: |
          gh release download openmw-0.51.0-kr13.2 --repo "$GITHUB_REPOSITORY" --pattern 'Morrowind-Korean-OpenMW-0.51.0-KR13.2-Full.zip' --dir original
          python3 packaging/korean/tooling/repack_kr1321_nexus.py build original/Morrowind-Korean-OpenMW-0.51.0-KR13.2-Full.zip
      - name: Upload Windows ZIP compatibility repack to its verified existing group
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8110335'
          filename: retry-dist/Morrowind-Korean-OpenMW-0.51.0-KR13.2.1-Full.zip
          version: '0.51.0-KR13.2.1'
          display_name: 'OpenMW Windows KR13.2.1 (ZIP repack)'
          description: 'Windows ZIP metadata compatibility repack of KR13.2. All 67 extracted files including executable, installer, translations, licenses and source patches are byte-identical. No nested archives. Existing quarantined KR13.2 is preserved for moderator review. Scan approval is checked separately; this does not assert the original quarantine was a false positive.'
          category: main
          archive_existing_version: false
          primary_mod_manager_download: true
          update_mod_version: true
          allow_mod_manager_download: true
      - name: Verify exact uploaded version, group, size and security approval
        run: python3 packaging/korean/tooling/repack_kr1321_nexus.py readback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KR13.2.1-Windows-ZIP-retry-evidence
          path: retry-dist/*
