name: Publish verified Windows KR9 on existing Nexus mod

on:
  workflow_dispatch:
    inputs:
      nexus_file_id:
        description: Existing main-file ID from Nexus Mods Morrowind mod 60496 (Files > API Info)
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_TAG: openmw-0.51.0-kr9
      SOURCE_ASSET: Morrowind-Korean-OpenMW-0.51.0-KR9-Full.zip
      NEXUS_MOD_PAGE: https://www.nexusmods.com/morrowind/mods/60496
    steps:
      - name: Require Nexus author API key and the existing file ID
        shell: bash
        env:
          NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUS_FILE: ${{ inputs.nexus_file_id }}
        run: |
          set -euo pipefail
          if [[ -z "$NEXUS_KEY" ]]; then
            echo '::error::NEXUSMODS_API_KEY repository secret is required. Configure it in GitHub Actions Secrets.'
            exit 1
          fi
          if [[ ! "$NEXUS_FILE" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo '::error::nexus_file_id must be the actual Nexus Mods file ID (Files > API Info), not mod ID 60496.'
            exit 1
          fi
          if [[ "$NEXUS_FILE" == 60496 ]]; then
            echo '::error::60496 is the page/mod ID, not the existing file ID.'
            exit 1
          fi
          echo 'Nexus credentials provided; secrets are never written to logs.'

      - name: Download authentic published Windows KR9 ZIP and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nexus-package
          gh release download "$SOURCE_TAG" \
            --repo "$GH_REPO" \
            --pattern "$SOURCE_ASSET" \
            --pattern "$SOURCE_ASSET.sha256" \
            --dir nexus-package
          (cd nexus-package && sha256sum --check "$SOURCE_ASSET.sha256")
          unzip -tq "nexus-package/$SOURCE_ASSET"
          python3 - <<'PY'
          import zipfile,os
          path='nexus-package/'+os.environ['SOURCE_ASSET']
          with zipfile.ZipFile(path) as z:
              names={name.replace('\\','/').lower() for name in z.namelist()}
          if 'payload/openmw.exe' not in names:
              raise SystemExit('Expected KR9 Windows OpenMW executable is absent')
          print('NEXUS_SOURCE_KR9_ZIP_CHECK=PASS')
          PY

      - name: Publish new KR9 version of the existing Nexus main file
        id: nexus_upload
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ inputs.nexus_file_id }}
          filename: nexus-package/Morrowind-Korean-OpenMW-0.51.0-KR9-Full.zip
          version: 0.51.0-KR9
          display_name: Morrowind Korean OpenMW 0.51.0-KR9
          description: 'Windows OpenMW 0.51.0 Korean KR9; fixes unintended Korean dialogue and journal topic hyperlinks. Preserves KR8 translation data and Aradraen CELL correction. Verified GitHub release.'
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          update_mod_version: true

      - name: Report published Nexus file version
        shell: bash
        env:
          VERSION_ID: ${{ steps.nexus_upload.outputs.version_id }}
        run: |
          echo "Nexus mod: $NEXUS_MOD_PAGE"
          echo "Nexus file version: $VERSION_ID"
          echo "Source GitHub release: https://github.com/$GH_REPO/releases/tag/$SOURCE_TAG"
          echo "Uploaded actual verified Windows KR9 ZIP, not an archive of other archives."
