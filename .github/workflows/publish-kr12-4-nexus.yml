name: Publish verified KR12.4 Windows release to Nexus Mods

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-kr12-4-nexus.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-kr124-windows
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TAG: openmw-0.51.0-kr12.4
  ZIP: Morrowind-Korean-OpenMW-0.51.0-KR12.4-Full.zip

jobs:
  verify-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
      NEXUS_FILE_ID: '8110335' # Verified Windows main file group from prior KR12.1/12.2 uploads; Android is 8257539
    steps:
      - uses: actions/checkout@v4
      - name: Verify official GitHub KR12.4 release exists
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /tmp/kr124-release.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/kr124-release.json'))
          assert r['tag_name']=='openmw-0.51.0-kr12.4' and not r['draft'] and not r['prerelease']
          files={x['name']:x for x in r['assets']}
          file=files['Morrowind-Korean-OpenMW-0.51.0-KR12.4-Full.zip']
          assert file['digest']=='sha256:71fbbd1ae5506df4444fe47f31b29101f010a96fa5d73bb4b8699977cd211497'
          assert file['size']>10000000
          assert 'Morrowind-Korean-OpenMW-0.51.0-KR12.4-Full.zip.sha256' in files
          assert 'KR12.4-Windows-release-verification.json' in files
          PY
      - name: Download published release files and verify SHA
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ZIP" --pattern "$ZIP.sha256" \
            --pattern KR12.4-Windows-release-verification.json --dir dist
          (cd dist && sha256sum -c "$ZIP.sha256")
          unzip -tq "dist/$ZIP"
          python3 - <<'PY'
          import json
          d=json.load(open('dist/KR12.4-Windows-release-verification.json'))
          assert d['version']=='KR12.4'
          assert d['changed_INFO_NAME_count']==91
          assert d['changed_TOP_aliases']==3
          assert d['zip_crc_integrity']=='PASS'
          assert not d['live_gameplay_verified']
          PY
      - name: Verify the owned Nexus mod, Windows file group and existing versions
        id: nexus
        run: |
          set -euo pipefail
          test -n "$NEXUS_KEY" || { echo "::error::NEXUSMODS_API_KEY repository secret is absent."; exit 1; }
          python3 - <<'PY'
          import json, os, re, urllib.request
          BASE="https://api.nexusmods.com"
          def get(path):
              request=urllib.request.Request(BASE+path,headers={
                  "apikey": os.environ["NEXUS_KEY"],
                  "Accept": "application/json",
                  "User-Agent": "Morrowind-KR12.4-GitHub-Release-Sync",
              })
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)["data"]
          mod=get("/v3/games/morrowind/mods/60496")
          assert str(mod["id"])=="429496790096", "Wrong Nexus mod UID"
          assert str(mod["game_scoped_id"])=="60496", "Wrong game scoped mod ID"
          groups=get("/v3/mods/"+str(mod["id"])+"/files")["mod_files"]
          file_id=os.environ["NEXUS_FILE_ID"]
          assert file_id=="8110335" and file_id!="8257539", "Refusing Android file group"
          found=[f for f in groups if str(f["id"])==file_id and f["is_active"]]
          assert len(found)==1 and found[0]["name"]=="Morrowind Korean OpenMW", "Windows main file group missing, renamed, or inactive"
          versions=get("/v3/mod-files/"+file_id+"/versions")["versions"]
          def normal(v):
              return re.sub(r"(?i)-kr","-kr",str(v).strip()).casefold()
          existed=any(normal(v.get("version",""))==normal("0.51.0-KR12.4")
                      and str(v.get("category","")).casefold()!="removed" for v in versions)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("upload="+str(not existed).lower()+"\n")
          print("Verified Nexus Morrowind mod 60496; active Windows file group",file_id)
          print("KR12.4 previously uploaded:",existed)
          PY
      - name: Upload verified KR12.4 to existing Windows Nexus file group
        if: steps.nexus.outputs.upload == 'true'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # pinned previously successful v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8110335'
          filename: dist/Morrowind-Korean-OpenMW-0.51.0-KR12.4-Full.zip
          version: 0.51.0-KR12.4
          display_name: Morrowind Korean OpenMW 0.51.0-KR12.4 (Windows)
          description: 'Cumulative Windows release: https://github.com/munument1/Morrowind-OpenMW-KR/releases/tag/openmw-0.51.0-kr12.4'
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          update_mod_version: true
          # Changelog is reconciled using the canonical Nexus mod UID, not game-scoped 60496.
      - name: Confirm Nexus has KR12.4 in the correct Windows file group
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          url="https://api.nexusmods.com/v3/mod-files/8110335/versions"
          req=urllib.request.Request(url,headers={
              "apikey":os.environ["NEXUS_KEY"],"Accept":"application/json",
              "User-Agent":"Morrowind-KR12.4-GitHub-Release-Sync"})
          for attempt in range(6):
              with urllib.request.urlopen(req,timeout=30) as response:
                  versions=json.load(response)["data"]["versions"]
              found=[v for v in versions
                     if str(v.get("version","")).casefold()=="0.51.0-kr12.4"
                     and str(v.get("category","")).casefold()!="removed"]
              if found:
                  print("SUCCESS: KR12.4 is present in the Nexus Windows main file group 8110335; no Android file changed.")
                  break
              if attempt==5:
                  raise SystemExit("KR12.4 missing from Nexus after upload; check Nexus API status.")
              time.sleep(5)
          PY
