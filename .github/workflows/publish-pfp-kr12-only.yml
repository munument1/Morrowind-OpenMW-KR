name: Publish PFP 5.0.7 kr1.2 only (preserve Rebirth)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pfp-507-kr12-only
  cancel-in-progress: false
jobs:
  publish-pfp-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve immutable, already published kr1.1 build artifact
        run: |
          mkdir -p reference
          gh run download 41323412147 --repo "$GITHUB_REPOSITORY" --name reviewed-mod-translations-kr11-publication --dir reference
      - name: Build and verify PFP kr1.2 from pinned kr1.1 translation bytes
        run: |
          python packaging/korean/tooling/publish_pfp_kr12.py --archive reference/PFP_5.0.7-kr1.1_OpenMW-KR12.5.zip --out dist
          cd dist
          sha256sum --check PFP_5.0.7-kr1.2_OpenMW-KR12.6.zip.sha256
      - name: Verify Nexus ownership, original version, and active PFP file group
        run: python packaging/korean/tooling/publish_pfp_kr12.py --nexus-preflight --out dist
      - name: Update ONLY the existing PFP Nexus file group
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8280147'
          filename: dist/PFP_5.0.7-kr1.2_OpenMW-KR12.6.zip
          version: 5.0.7-kr1.2
          display_name: PFP Korean
          description: 'kr1.2: 토픽 대상이 없는 명시 링크 2건 제거. 나머지 번역과 TOP/MRK, 게임 로직 유지. OpenMW KR12.6 정적 QA 통과, 실게임 미검증.'
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          update_mod_version: true
      - name: Read back Nexus PFP version metadata and changelog
        run: python packaging/korean/tooling/publish_pfp_kr12.py --nexus-verify --out dist
      - name: Preserve independent PFP publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfp-507-kr12-nexus-publication
          path: dist/
          retention-days: 30
