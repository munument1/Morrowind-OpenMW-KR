name: Publish verified KR12.6 Windows release to Nexus Mods

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-kr12-6-nexus.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-kr124-windows
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TAG: openmw-0.51.0-kr12.6
  ZIP: Morrowind-Korean-OpenMW-0.51.0-KR12.6-Full.zip

jobs:
  verify-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
      NEXUS_FILE_ID: '8110335' # Verified Windows main file group from prior KR12.1/12.2 uploads; Android is 8257539
    steps:
      - uses: actions/checkout@v4
      - name: Verify official GitHub KR12.6 release exists
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /tmp/kr124-release.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/kr124-release.json'))
          assert r['tag_name']=='openmw-0.51.0-kr12.6' and not r['draft'] and not r['prerelease']
          files={x['name']:x for x in r['assets']}
          file=files['Morrowind-Korean-OpenMW-0.51.0-KR12.6-Full.zip']
          assert file['digest']=='sha256:2f4bb6b9cfd5916fd9574b6207628e4bb16f8bdc4f1c68fc1ef7581c970989e9'
          assert file['size']>10000000
          assert 'Morrowind-Korean-OpenMW-0.51.0-KR12.6-Full.zip.sha256' in files
          assert 'verification.json' in files
          PY
      - name: Download published release files and verify SHA
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ZIP" --pattern "$ZIP.sha256" \
            --pattern verification.json --dir dist
          (cd dist && sha256sum -c "$ZIP.sha256")
          unzip -tq "dist/$ZIP"
          python3 - <<'PY'
          import json
          d=json.load(open('dist/verification.json'))
          assert isinstance(d,dict) and d, 'Missing KR12.6 verification data'
          print('KR12.6 published verification report present; ZIP CRC and pinned SHA confirmed')
          PY
      - name: Verify the owned Nexus mod, Windows file group and existing versions
        id: nexus
        run: |
          set -euo pipefail
          test -n "$NEXUS_KEY" || { echo "::error::NEXUSMODS_API_KEY repository secret is absent."; exit 1; }
          python3 - <<'PY'
          import json, os, re, urllib.request
          BASE="https://api.nexusmods.com"
          def get(path):
              request=urllib.request.Request(BASE+path,headers={
                  "apikey": os.environ["NEXUS_KEY"],
                  "Accept": "application/json",
                  "User-Agent": "Morrowind-KR12.6-GitHub-Release-Sync",
              })
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)["data"]
          mod=get("/v3/games/morrowind/mods/60496")
          assert str(mod["id"])=="429496790096", "Wrong Nexus mod UID"
          assert str(mod["game_scoped_id"])=="60496", "Wrong game scoped mod ID"
          groups=get("/v3/mods/"+str(mod["id"])+"/files")["mod_files"]
          file_id=os.environ["NEXUS_FILE_ID"]
          assert file_id=="8110335" and file_id!="8257539", "Refusing Android file group"
          found=[f for f in groups if str(f["id"])==file_id and f["is_active"]]
          assert len(found)==1 and found[0]["name"]=="Morrowind Korean OpenMW", "Windows main file group missing, renamed, or inactive"
          versions=get("/v3/mod-files/"+file_id+"/versions")["versions"]
          def normal(v):
              return re.sub(r"(?i)-kr","-kr",str(v).strip()).casefold()
          existed=any(normal(v.get("version",""))==normal("0.51.0-KR12.6")
                      and str(v.get("category","")).casefold()!="removed" for v in versions)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("upload="+str(not existed).lower()+"\n")
          print("Verified Nexus Morrowind mod 60496; active Windows file group",file_id)
          print("KR12.6 previously uploaded:",existed)
          PY
      - name: Upload verified KR12.6 to existing Windows Nexus file group
        if: steps.nexus.outputs.upload == 'true'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # pinned previously successful v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8110335'
          filename: dist/Morrowind-Korean-OpenMW-0.51.0-KR12.6-Full.zip
          version: 0.51.0-KR12.6
          display_name: Morrowind Korean OpenMW 0.51.0-KR12.6 (Windows)
          description: 'Cumulative Windows release: https://github.com/munument1/Morrowind-OpenMW-KR/releases/tag/openmw-0.51.0-kr12.6'
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          update_mod_version: true
          # Changelog is reconciled using the canonical Nexus mod UID, not game-scoped 60496.
      - name: Confirm Nexus has KR12.6 in the correct Windows file group
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          url="https://api.nexusmods.com/v3/mod-files/8110335/versions"
          req=urllib.request.Request(url,headers={
              "apikey":os.environ["NEXUS_KEY"],"Accept":"application/json",
              "User-Agent":"Morrowind-KR12.6-GitHub-Release-Sync"})
          for attempt in range(6):
              with urllib.request.urlopen(req,timeout=30) as response:
                  versions=json.load(response)["data"]["versions"]
              found=[v for v in versions
                     if str(v.get("version","")).casefold()=="0.51.0-kr12.6"
                     and str(v.get("category","")).casefold()!="removed"]
              if found:
                  print("SUCCESS: KR12.6 is present in the Nexus Windows main file group 8110335; no Android file changed.")
                  break
              if attempt==5:
                  raise SystemExit("KR12.6 missing from Nexus after upload; check Nexus API status.")
              time.sleep(5)
          PY
      - name: Reconcile missing KR12.6 changelog using canonical Nexus UID (never re-upload)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          BASE="https://api.nexusmods.com"
          hdr={"apikey":os.environ["NEXUS_KEY"],"Accept":"application/json",
               "Content-Type":"application/json","User-Agent":"Morrowind-KR12.6-Changelog"}
          def call(path,body=None):
              req=urllib.request.Request(BASE+path,headers=hdr,
                  data=json.dumps(body,ensure_ascii=False).encode("utf-8") if body is not None else None,
                  method="POST" if body is not None else "GET")
              with urllib.request.urlopen(req,timeout=35) as response:
                  return json.load(response)
          mod=call("/v3/games/morrowind/mods/60496")["data"]
          assert str(mod["id"])=="429496790096" and str(mod["game_scoped_id"])=="60496"
          assert str(mod.get("version","")).casefold()=="0.51.0-kr12.6", "Mod version has not yet been updated"
          versions=call("/v3/mod-files/8110335/versions")["data"]["versions"]
          assert any(str(x.get("version","")).casefold()=="0.51.0-kr12.6"
                     and str(x.get("category","")).casefold()!="removed" for x in versions), "Missing Windows file version"
          logs=call("/v1/games/morrowind/mods/60496/changelogs.json")
          if not isinstance(logs,dict):
              raise ValueError("Nexus v1 changelog list has unexpected shape; refusing duplicate append")
          prior=[k for k in logs if k.casefold()=="0.51.0-kr12.6"]
          if prior:
              print("KR12.6 changelog already exists; no new changelog entry was added.")
          else:
              body={"version":"0.51.0-KR12.6",
                    "changelog":"KR12.6 Windows 누적 업데이트: 본편 INFO.NAME 230개 필드에서 명시 토픽 링크 256개의 클릭 범위를 교정하고 기존 목표 ID를 유지하는 .top 별칭 86개를 추가했습니다. 대화 표시 한국어, 기존 퀘스트 조건·스크립트·DIAL/INFO ID는 유지했습니다. KR12.5 Windows 바이너리·설치기를 포함한 Full ZIP입니다. TES3 구조·토픽 연결·ZIP 무결성 정적 검증 통과. 안전한 연결 경계가 불분명한 48개 후보는 보류했으며 전체 실게임 플레이와 Android 검증은 수행하지 않았습니다."}
              result=call("/v3/mods/"+str(mod["id"])+"/changelogs",body)
              print("KR12.6 changelog appended using canonical Nexus mod UID 429496790096.")
          PY
