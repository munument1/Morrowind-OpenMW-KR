name: Restore PFP description with OpenMW install steps only
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/restore-pfp-installation-only-20261101.yml
permissions:
  contents: read
  actions: read
jobs:
  restore:
    if: github.repository == 'munument1/Morrowind-OpenMW-KR'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download original description saved before accidental full rewrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p saved
          gh run download 41218642254 --repo munument1/Morrowind-OpenMW-KR --name nexus-pfp-description-20261101 --dir saved
          test -s saved/nexus-pfp-60826-before.txt
          test -s saved/nexus-pfp-60826-proposed.txt
      - name: Restore all original description except OpenMW installation numbered list
        uses: actions/github-script@v7
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        with:
          script: |
            const fs=require('fs');
            const crypto=require('crypto');
            const hash=s=>crypto.createHash('sha256').update(s,'utf8').digest('hex');
            const original=fs.readFileSync('saved/nexus-pfp-60826-before.txt','utf8');
            const lastErroneous=fs.readFileSync('saved/nexus-pfp-60826-proposed.txt','utf8');
            if(hash(original)!=='a792583f2d8ed2287c98bfb71032d89b85a7444787c16f4213c0d58b9dccd163') throw new Error('Original backup differs from verified original');
            if(hash(lastErroneous)!=='2d256aa36b757eb61aab7862ccc50c76f95ad7b79c524ca1922d65bcee6dcb09') throw new Error('Erroneous prior version differs from verified backup');
            const open='[list=1]\n<br />';
            const close='[/list]';
            const begin=original.indexOf(open);
            const end=original.indexOf(close,begin)+close.length;
            if(begin<0 || end<close.length || original.indexOf(open,begin+1)!==-1 || original.indexOf(close,end)!==-1) throw new Error('Original installation list boundaries ambiguous');
            if(!original.slice(begin,end).includes('Morrowind Code Patch')) throw new Error('Original installation list changed unexpectedly');
            const replacement=[
              '[list=1]',
              '<br />[*][url=https://www.nexusmods.com/morrowind/mods/60496]OpenMW 한국어판[/url]을 설치합니다.[/*]',
              '<br />[*][url=https://www.nexusmods.com/morrowind/mods/45096]Patch for Purists 5.0.7 원본[/url]을 별도 폴더에 설치합니다.[/*]',
              '<br />[*]이 페이지의 한국어 패치를 원본 PFP 폴더에 덮어씁니다.[/*]',
              '<br />[*]OpenMW Launcher의 [b]Data Files → Data Directories[/b]에서 해당 PFP 폴더를 등록합니다.[/*]',
              '<br />[*][b]Content Files[/b]에서 [b]Patch for Purists.esm[/b]을 활성화합니다.[/*]',
              '<br />[/list]'
            ].join('\n');
            const restored=original.slice(0,begin)+replacement+original.slice(end);
            const nexusNormalized=s=>s.replace(/\n/g,'\n<br />');
            if(hash(restored)!=='d9ddb630a2d50f3d1016c61e86630d8746a02c748899191a83484c6ec763f4e5') throw new Error('Patched description mismatch');
            if(restored.slice(0,begin)!==original.slice(0,begin) ||
               restored.slice(begin+replacement.length)!==original.slice(end)) throw new Error('Outside installation block modified');
            const key=(process.env.NEXUS_API_KEY||'').trim();
            if(!key) throw new Error('NEXUSMODS_API_KEY missing');
            core.setSecret(key);
            async function api(path,method='GET',body) {
              const response=await fetch('https://api.nexusmods.com'+path,{
                method,headers:{apikey:key,'Content-Type':'application/json','User-Agent':'PFP-KR-install-only-restore'},
                body:body===undefined?undefined:JSON.stringify(body),redirect:'error'
              });
              if(!response.ok) throw new Error('Nexus '+method+' '+path+' HTTP '+response.status);
              return response.status===204?null:response.json();
            }
            const account=await api('/v1/users/validate.json');
            const legacy=await api('/v1/games/morrowind/mods/60826.json');
            if(!legacy.uid || String(account.user_id)!==String(legacy.user?.member_id)) throw new Error('Not owner of Nexus PFP #60826');
            if(String(legacy.version)!=='5.0.7-kr1.0') throw new Error('PFP published version changed, refusing unrelated edit');
            const modUid=String(legacy.uid);
            const currentData=(await api('/v3/mods/'+modUid)).data;
            const current=currentData.mod||currentData;
            if(typeof current.description!=='string') throw new Error('Description missing');
            fs.writeFileSync('saved/nexus-pfp-60826-live-current.txt',current.description);
            core.info('LIVE_DESCRIPTION_SHA256='+hash(current.description)+'; LEN='+current.description.length+'; EXPECTED='+hash(lastErroneous));
            core.info('Read-only capture of current Nexus description; no new PATCH in this run');
            return;
            if(current.description!==nexusNormalized(lastErroneous) && current.description!==lastErroneous && current.description!==restored && current.description!==nexusNormalized(restored)) throw new Error('Nexus description differs from posted draft or its normalised format. Preserving unknown user changes.');
            fs.writeFileSync('saved/nexus-pfp-60826-restored-install-only.txt',restored);
            if(current.description!==restored && current.description!==nexusNormalized(restored)) await api('/v3/mods/'+modUid,'PATCH',{description:restored});
            const readBackData=(await api('/v3/mods/'+modUid)).data;
            const readBack=readBackData.mod||readBackData;
            if(readBack.description!==restored && readBack.description!==nexusNormalized(restored)) throw new Error('Nexus readback is not the expected restored text (allowing only known Nexus newline normalization)');
            core.info('RESTORE PASS: Complete original description preserved; only install [list=1] changed. '+hash(restored));
            await core.summary.addHeading('Nexus PFP #60826 recovered').addRaw('The original pre-edit description was restored byte-for-byte except for its numbered installation list. Version, summary and mod files unchanged. Hash: '+hash(restored)).write();
      - name: Save proof of original and repaired descriptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfp-original-and-install-only-restored-20261101
          path: saved/nexus-pfp-60826-*.txt
          if-no-files-found: warn
